# CampMixer. The Pi has one login, "mixer", with a password and sudo. That login opens everything,
# so this trims what the SSH door offers to someone who has not got it.
# (Only settings that both Raspberry Pi OS Bookworm and Trixie understand.)

# Nobody logs in as root. Root work is done with sudo from the mixer account.
PermitRootLogin no
# Half a minute to log in, not two.
LoginGraceTime 30
# No graphical programs to forward on a Pi without a screen.
X11Forwarding no
PermitEmptyPasswords no
